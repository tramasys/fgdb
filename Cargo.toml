[package]
name = "fgdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A native, terminal-friendly GDB frontend"
repository = "https://github.com/tramasys/fgdb"
license = "MIT"
autoexamples = false

[features]
default = ["ebpf"]
ebpf = ["dep:libbpf-rs"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
futures-channel = "0.3.32"
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
glib-unix = "0.22.8"
libbpf-rs = { version = "0.27.1", optional = true }
memchr = { version = "2.8.3", features = ["std"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "term"] }
rustix = { version = "1.1.4", features = ["fs", "param", "process"] }
shell-words = "1.1.1"
sourceview5 = { version = "0.11.2", features = ["gtk_v4_18", "v5_18"] }
vte4 = { version = "0.10.0", features = ["gtk_v4_18", "v0_84"] }

[build-dependencies]
glib-build-tools = "0.22.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
